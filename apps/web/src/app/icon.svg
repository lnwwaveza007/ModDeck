<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ModDeck">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7448"/>
      <stop offset="1" stop-color="#d63a0e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- deck: stacked cards behind -->
  <rect x="112" y="112" width="288" height="232" rx="56" fill="#ffffff" opacity="0.25" transform="rotate(12 256 228)"/>
  <rect x="112" y="112" width="288" height="232" rx="56" fill="#ffffff" opacity="0.5" transform="rotate(6 256 228)"/>
  <!-- front card as speech bubble: live Q&A -->
  <rect x="112" y="112" width="288" height="232" rx="56" fill="#ffffff"/>
  <path d="M158 336 L158 408 L230 344 Z" fill="#ffffff"/>
  <!-- ant (มด = mod): three round body parts, antennae, legs -->
  <g fill="none" stroke="#fa4616" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M238 250 L222 284 L204 306"/>
    <path d="M254 256 L256 290 L252 312"/>
    <path d="M272 250 L290 284 L308 306"/>
    <path d="M322 192 Q330 158 360 148"/>
    <path d="M304 190 Q298 164 320 144"/>
  </g>
  <circle cx="178" cy="236" r="48" fill="#fa4616"/>
  <circle cx="252" cy="226" r="30" fill="#fa4616"/>
  <circle cx="312" cy="214" r="28" fill="#fa4616"/>
  <circle cx="322" cy="208" r="6" fill="#ffffff"/>
</svg>
