<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModDeck Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0b1020;--panel:#11182b;--line:#1f2a44;--text:#e2e8f0;--muted:#94a3b8;
  --accent:#fa4616;--accent-soft:rgb(250 70 22 / .14);--stage:#0b1020;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:14px;line-height:20px;display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}

/* sidebar */
aside{width:280px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand i{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.brand b{font-size:16px}
.brand span{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px}
.starts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 12px}
.starts button{height:40px;border-radius:8px;border:1px solid var(--line);background:#0b1020;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.starts button:hover{border-color:var(--accent)}
.list{overflow:auto;flex:1;padding:4px 8px 16px}
details{margin:2px 0}
summary{list-style:none;cursor:pointer;padding:8px;border-radius:6px;font-weight:600;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
summary small{margin-left:auto;font-weight:500}
.scr{display:flex;width:100%;text-align:left;gap:8px;align-items:baseline;border:0;background:transparent;padding:6px 8px 6px 22px;border-radius:6px;color:var(--text)}
.scr:hover{background:#18223a}
.scr code{font-size:11px;color:var(--muted);min-width:34px}
.scr.on{background:var(--accent-soft);color:#fff;box-shadow:inset 2px 0 0 var(--accent)}
.scr.on code{color:#ffb59a}
.scr .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:#3b82f6;flex:none;align-self:center}
.help{border-top:1px solid var(--line);padding:12px 16px;color:var(--muted);font-size:12px;line-height:18px}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--text)}

/* main */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{height:52px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.bar .t{flex:1;min-width:0;display:flex;flex-direction:column;padding:0 8px}
.bar .t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t span{font-size:12px;color:var(--muted)}
.ib{height:36px;min-width:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#0b1020;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib:hover:not(:disabled){border-color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default}
.ib[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.stage{flex:1;min-height:0;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,#16213b 0,var(--stage) 70%)}
.frame{position:absolute;left:50%;top:50%;transform-origin:center center;background:#fff;overflow:hidden;transition:width .2s,height .2s}
.frame.phone{border-radius:44px;box-shadow:0 0 0 12px #1e293b,0 0 0 13px #334155,0 30px 80px rgb(0 0 0 / .6)}
.frame.desk{border-radius:10px;box-shadow:0 0 0 1px #334155,0 30px 80px rgb(0 0 0 / .55)}
.frame iframe{border:0;width:100%;height:100%;display:block;background:#fff}
.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:#0f172a;border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* presentation mode */
body.present aside,body.present .bar{display:none}
body.present .stage{background:#000}
.exit{position:fixed;right:12px;top:12px;z-index:5;display:none;opacity:.25}
.exit:hover{opacity:1}
body.present .exit{display:inline-flex}

@media (max-width:760px){
  aside{position:fixed;inset:0 auto 0 0;z-index:10;transform:translateX(-100%);transition:transform .2s}
  body.menu aside{transform:none}
}
@media (min-width:761px){#menuBtn{display:none}}
</style>
</head>
<body>
<aside aria-label="Screens">
  <div class="brand">
    <i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg></i>
    <b>ModDeck</b><span>Prototype</span>
  </div>
  <div class="starts">
    <button data-start="Main.dc.html">▶ Student</button>
    <button data-start="H00-Login.dc.html">▶ Host</button>
  </div>
  <nav class="list" id="list"></nav>
  <div class="help">
    Every button works. Screens with no buttons (projector, leaderboards) advance on click. Loading screens move on by themselves.<br>
    <kbd>←</kbd> <kbd>→</kbd> prev/next screen · <kbd>Alt</kbd>+<kbd>←</kbd> back<br>
    <kbd>H</kbd> show hotspots · <kbd>P</kbd> present · <kbd>F</kbd> fullscreen
  </div>
</aside>

<main>
  <div class="bar">
    <button class="ib" id="menuBtn" aria-label="Screens">☰</button>
    <button class="ib" id="backBtn" aria-label="Back" title="Back (Alt+←)">←</button>
    <button class="ib" id="restartBtn" title="Restart flow">↺ Restart</button>
    <div class="t"><b id="title">…</b><span id="sub"></span></div>
    <button class="ib" id="prevBtn" aria-label="Previous screen" title="Previous screen (←)">‹</button>
    <button class="ib" id="nextBtn" aria-label="Next screen" title="Next screen (→)">›</button>
    <button class="ib" id="hintBtn" aria-pressed="false" title="Show hotspots (H)">Hotspots</button>
    <button class="ib" id="presentBtn" title="Presentation mode (P)">Present</button>
  </div>
  <div class="stage" id="stage">
    <div class="frame" id="frame"><iframe id="view" title="Prototype screen"></iframe></div>
    <div class="toast" id="toast"></div>
  </div>
</main>
<button class="ib exit" id="exitBtn" title="Exit presentation (Esc)">✕</button>

<script src="wiring.js"></script>
<script>
// Screen catalog: [file, code, title, kind]. kind: phone 390x844, proj 1280x720, desk 1440x900.
const GROUPS = [
  { name: 'Student', items: [
    ['Main.dc.html','S01','Enter PIN','phone'],
    ['S03-Identity.dc.html','S03','Choose identity','phone'],
    ['S04-Nickname.dc.html','S04','Guest nickname','phone'],
    ['S06-Waiting.dc.html','S06','Waiting + reactions','phone'],
    ['S07-Poll.dc.html','S07','Live Poll: answer','phone'],
    ['S08-Poll-sent.dc.html','S08','Live Poll: answer sent','phone'],
    ['S10-Poll-results.dc.html','S10','Live Poll: results','phone'],
    ['S07b-Poll-code-math.dc.html','S07b','Poll: code and math options','phone'],
    ['S11-WordCloud.dc.html','S11','Word Cloud: input','phone'],
    ['S12-WordCloud-results.dc.html','S12','Word Cloud: results','phone'],
    ['S13-QA-list.dc.html','S13','Q&A list + upvote','phone'],
    ['S14-Ask-anon.dc.html','S14','Ask question (anonymous)','phone'],
    ['S15-Ask-named.dc.html','S15','Ask question: named','phone'],
    ['S21-Ended.dc.html','S21','Session ended','phone'],
  ]},
  { name: 'Host', items: [
    ['H00-Login.dc.html','H00','Host sign-in (KMUTT SSO)','desk'],
    ['H01-Decks.dc.html','H01','My decks + New deck','desk'],
    ['H03-Add-slide.dc.html','H03','Add slide + PDF import','desk'],
    ['H02-Editor.dc.html','H02','Deck editor: Live Poll','desk'],
    ['H04b-Settings.dc.html','H04b','Session settings','desk'],
    ['H04-Preflight.dc.html','H04','Pre-flight + live lock','desk'],
    ['H05-Presenter.dc.html','H05','Presenter: Live Poll','desk'],
    ['H06-Presenter-QA.dc.html','H06','Presenter: Word Cloud + Q&A','desk'],
    ['H07-Activity-states.dc.html','H07','Activity control states','desk'],
    ['H08-People.dc.html','H08','People + co-host invite','desk'],
    ['H09-End-session.dc.html','H09','End session','desk'],
    ['H13-Results.dc.html','H13','Session results + export','desk'],
    ['H12-History.dc.html','H12','Session history','desk'],
    ['H11-Cohost-QA.dc.html','H11','Co-host Q&A','desk'],
    ['H10-Mirror-overlay.dc.html','H10','Mirror mode overlay','desk'],
  ]},
  { name: 'Projector', items: [
    ['P01-Lobby.dc.html','P01','Lobby','proj'],
    ['P02-Content.dc.html','P02','Content slide + reactions','proj'],
    ['P03-Poll-live.dc.html','P03','Live Poll: voting open','proj'],
    ['P04-Poll-results.dc.html','P04','Live Poll: results','proj'],
    ['P05-WordCloud.dc.html','P05','Word Cloud: results','proj'],
    ['P06-QA.dc.html','P06','Q&A on screen','proj'],
    ['P08-Math.dc.html','P08','Math slide','proj'],
    ['P09-Code.dc.html','P09','Code slide','proj'],
    ['P07-Ended.dc.html','P07','Session ended','proj'],
    ['P07b-Blank.dc.html','P07b','Blank screen (B)','proj'],
  ]},
  { name: 'States', items: [
    ['E01-Joining.dc.html','E01','Loading: joining','phone'],
    ['E02-Poll-loading.dc.html','E02','Loading: activity','phone'],
    ['E03-QA-empty.dc.html','E03','Empty: no questions','phone'],
    ['S09-Voting-closed.dc.html','S09','Voting closed','phone'],
    ['S17-QA-closed.dc.html','S17','Q&A closed','phone'],
    ['S02-PIN-error.dc.html','S02','Error: PIN not found','phone'],
    ['S05-Session-full.dc.html','S05','Error: session full','phone'],
    ['S18-Reconnecting.dc.html','S18','Reconnecting…','phone'],
    ['S19-Connection-lost.dc.html','S19','Connection lost','phone'],
    ['S20-Host-away.dc.html','S20','Host away + rename','phone'],
    ['E04-SSO-error.dc.html','E04','Student sign-in failed','phone'],
    ['E05-Host-login-error.dc.html','E05','Host sign-in failed','desk'],
    ['H-Reconnecting.dc.html','H','Presenter: reconnecting','desk'],
    ['P-Zero-responses.dc.html','P','Poll: no responses','proj'],
    ['P-Reconnecting.dc.html','P','Audience screen: reconnecting','proj'],
  ]},
  { name: 'Roadmap R2–R3', items: [
    ['R2-Quiz-editor.dc.html','R2','Live Quiz: editor','desk'],
    ['R2-Quiz-student.dc.html','R2','Live Quiz: answering','phone'],
    ['R2-Quiz-result.dc.html','R2','Live Quiz: result + rank','phone'],
    ['R2-Leaderboard.dc.html','R2','Leaderboard (projector)','proj'],
    ['R2-Team.dc.html','R2','Team mode leaderboard','proj'],
    ['R2-Analytics.dc.html','R2','Session analysis heatmap','desk'],
    ['R2-QA-clusters.dc.html','R2','AI Q&A clustering','desk'],
    ['R3-Slide-lookup.dc.html','R3','AI slide lookup','desk'],
    ['R3-Synonyms.dc.html','R3','AI synonym merge','desk'],
    ['R3-AI-Suggestion.dc.html','R3','AI pre-session planner','desk'],
    ['R3-Peek-presenter.dc.html','R3','Peek: presenter','desk'],
    ['R3-Peek-projector.dc.html','R3','Peek: projector','proj'],
  ]},
];
const SIZES = { phone:[390,844], proj:[1280,720], desk:[1440,900] };
const INTERACTIVE = new Set(['Main.dc.html','H00-Login.dc.html','H01-Decks.dc.html','H02-Editor.dc.html','H03-Add-slide.dc.html','H04-Preflight.dc.html','H04b-Settings.dc.html','H05-Presenter.dc.html','H06-Presenter-QA.dc.html','H09-End-session.dc.html','H12-History.dc.html','H13-Results.dc.html','S03-Identity.dc.html','S04-Nickname.dc.html','S06-Waiting.dc.html','S07-Poll.dc.html','S08-Poll-sent.dc.html','S10-Poll-results.dc.html','S11-WordCloud.dc.html','S12-WordCloud-results.dc.html','S13-QA-list.dc.html','S14-Ask-anon.dc.html','S15-Ask-named.dc.html','S21-Ended.dc.html']);

const META = {};
GROUPS.forEach(g => g.items.forEach(([file, code, title, kind]) => { META[file] = { file, code, title, kind, group: g }; }));

const $ = id => document.getElementById(id);
const view = $('view'), frame = $('frame'), stage = $('stage');
let current = null, stack = [], hints = false, navByUs = false, flowStart = 'Main.dc.html';

// Sidebar
const list = $('list');
GROUPS.forEach((g, gi) => {
  const d = document.createElement('details');
  d.open = gi < 2;
  d.innerHTML = `<summary>${g.name}<small>${g.items.length}</small></summary>`;
  g.items.forEach(([file, code, title]) => {
    const b = document.createElement('button');
    b.className = 'scr'; b.dataset.file = file;
    b.innerHTML = `<code>${code}</code><span>${title}</span>${""}`;
    b.onclick = () => go(file);
    d.appendChild(b);
  });
  g.el = d;
  list.appendChild(d);
});

function go(file, { push = true } = {}) {
  if (push && current && current !== file) stack.push(current);
  navByUs = true;
  view.src = 'screens/' + file;
  document.body.classList.remove('menu');
}

function fileOf(win) {
  try { return decodeURIComponent(win.location.pathname.split('/').pop()); } catch { return null; }
}

function fit() {
  const m = current && META[current];
  const [w, h] = SIZES[m ? m.kind : 'desk'];
  const pad = document.body.classList.contains('present') ? 0 : (m && m.kind === 'phone' ? 64 : 40);
  const s = Math.min((stage.clientWidth - pad * 2) / w, (stage.clientHeight - pad * 2) / h, m && m.kind === 'phone' ? 1.25 : 2);
  frame.style.width = w + 'px';
  frame.style.height = h + 'px';
  frame.style.transform = `translate(-50%,-50%) scale(${s})`;
  frame.className = 'frame ' + (m && m.kind === 'phone' ? 'phone' : 'desk');
}

function update() {
  const m = META[current];
  $('title').textContent = m ? `${m.code} · ${m.title}` : current;
  $('sub').textContent = m ? `${m.group.name} · ${m.group.items.findIndex(i => i[0] === current) + 1} of ${m.group.items.length}` : '';
  document.querySelectorAll('.scr').forEach(b => b.classList.toggle('on', b.dataset.file === current));
  const on = document.querySelector('.scr.on');
  if (on) { on.closest('details').open = true; on.scrollIntoView({ block: 'nearest' }); }
  $('backBtn').disabled = !stack.length;
  const idx = m ? m.group.items.findIndex(i => i[0] === current) : -1;
  $('prevBtn').disabled = idx <= 0;
  $('nextBtn').disabled = !m || idx >= m.group.items.length - 1;
  if (m && (current === 'Main.dc.html' || current === 'H00-Login.dc.html')) flowStart = current;
  location.hash = current;
  fit();
}

function step(d) {
  const m = META[current]; if (!m) return;
  const i = m.group.items.findIndex(x => x[0] === current) + d;
  if (i >= 0 && i < m.group.items.length) go(m.group.items[i][0]);
}

function back() {
  if (!stack.length) return;
  go(stack.pop(), { push: false });
}

let toastT;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600);
}

function setHints(on) {
  hints = on;
  $('hintBtn').setAttribute('aria-pressed', on);
  applyHints();
}

function applyHints() {
  let doc; try { doc = view.contentDocument; } catch { return; }
  if (!doc) return;
  let st = doc.getElementById('__proto_hint');
  if (!st) { st = doc.createElement('style'); st.id = '__proto_hint'; doc.head.appendChild(st); }
  const sel = 'a[href],button,[role=switch],[role=tab],[role=radio],[role=checkbox]';
  st.textContent = `
    @keyframes __pp{0%,100%{box-shadow:0 0 0 2px rgb(59 130 246/.9),0 0 0 6px rgb(59 130 246/.25)}50%{box-shadow:0 0 0 2px rgb(59 130 246/.9),0 0 0 10px rgb(59 130 246/.08)}}
    ${hints ? sel + '{animation:__pp 1.2s ease-in-out infinite!important;outline:none}' : ''}
    body.__flash ${sel}{animation:__pp .5s ease-in-out 2!important}
    ${sel}{cursor:pointer}`;
}

view.addEventListener('load', () => {
  const f = fileOf(view.contentWindow);
  // Link clicks inside the screen: record history for in-screen navigation.
  if (!navByUs && current && f && f !== current) stack.push(current);
  navByUs = false;
  current = f;
  update();
  applyHints();
  const doc = view.contentDocument;
  if (!doc) return;
  doc.addEventListener('keydown', onKey);
  // Every control gets a destination or a state change; a dead area flashes the hotspots.
  protoWire(doc, f.replace('.dc.html', ''), {
    go: file => go(file),
    toast,
    flash: () => { doc.body.classList.remove('__flash'); void doc.body.offsetWidth; doc.body.classList.add('__flash'); },
  });
});

function onKey(e) {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); back(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (e.key === 'h' || e.key === 'H') setHints(!hints);
  else if (e.key === 'p' || e.key === 'P') togglePresent();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'Escape' && document.body.classList.contains('present')) togglePresent(false);
}
document.addEventListener('keydown', onKey);

function togglePresent(on) {
  document.body.classList.toggle('present', on);
  fit();
}
function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

$('backBtn').onclick = back;
$('restartBtn').onclick = () => { stack = []; go(flowStart, { push: false }); };
$('prevBtn').onclick = () => step(-1);
$('nextBtn').onclick = () => step(1);
$('hintBtn').onclick = () => setHints(!hints);
$('presentBtn').onclick = () => togglePresent(true);
$('exitBtn').onclick = () => togglePresent(false);
$('menuBtn').onclick = () => document.body.classList.toggle('menu');
document.querySelectorAll('[data-start]').forEach(b => b.onclick = () => { stack = []; go(b.dataset.start, { push: false }); });
new ResizeObserver(fit).observe(stage);

window.addEventListener('hashchange', () => {
  const f = decodeURIComponent(location.hash.slice(1));
  if (META[f] && f !== current) go(f);
});

const start = decodeURIComponent(location.hash.slice(1));
go(META[start] ? start : 'Main.dc.html', { push: false });
</script>
</body>
</html>
