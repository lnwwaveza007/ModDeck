<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>S07b Poll with code and math</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=STIX+Two+Text:ital,wght@0,400;1,400&amp;display=swap">
<style>
body{margin:0}
.ph{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#ffffff;color:#0f172a;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:26px;position:relative;overflow:hidden}
.ph *{box-sizing:border-box}
.ph h1,.ph h2,.ph h3,.ph p{margin:0}
.hdr{display:flex;align-items:center;gap:4px;padding:8px 4px 8px 16px;border-bottom:1px solid #e2e8f0;min-height:64px;background:#ffffff}
.hdr-t{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr-t b{font-size:16px;line-height:24px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-t span{font-size:13px;line-height:20px;color:#475569;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#059669;flex:none;display:inline-block}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:#334155;padding:0;flex:none}
.btn{height:52px;border-radius:8px;border:0;font:inherit;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 20px}
.btn-p{background:#d63a0e;color:#ffffff}
.tabs{display:flex;border-top:1px solid #e2e8f0;background:#ffffff;padding:0 8px 12px}
.tab{flex:1;height:60px;border:0;background:none;font:inherit;font-size:13px;line-height:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#475569;position:relative}
.tab.on{color:#b02f0b;font-weight:600}
.tab.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:#fa4616}
.cnt{min-width:20px;height:20px;border-radius:10px;background:#d63a0e;color:#ffffff;font-size:11px;line-height:20px;font-weight:600;padding:0 6px;position:absolute;top:6px;left:calc(50% + 8px)}
.opt{width:100%;min-height:64px;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;font:inherit;font-size:17px;line-height:26px;color:#0f172a;text-align:left;border:1px solid #cbd5e1;background:#ffffff}
.opt.on{border:2px solid #fa4616;background:#fff4ee;padding:11px 15px}
.key{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;background:#ffffff;color:#0f172a}
.box{width:24px;height:24px;border-radius:6px;flex:none;margin-left:auto;border:2px solid #94a3b8;background:#ffffff;display:grid;place-items:center}
.on .box{border:0;background:#d63a0e}
.code{font-family:'IBM Plex Mono',monospace;font-size:16px;line-height:24px;padding:4px 8px;border-radius:6px;background:#f1f5f9;border:1px solid #e2e8f0;color:#0f172a}
.on .code{background:#ffffff}
.kw{color:#7c3aed}.num{color:#b45309}.fn{color:#0e7490}
.m{font-family:'STIX Two Text',serif;font-size:21px;line-height:26px}
.m i{font-style:italic}
.lim{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 2px}
.lim small{font-size:12px;line-height:13px}
</style>
</helmet>
<div class="ph">
  <div class="hdr">
    <div class="hdr-t"><b>INT365 Software Engineering</b><span><i class="dot"></i>เชื่อมต่อแล้ว · พลอย</span></div>
    <button class="ib" aria-label="เมนู"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></button>
  </div>

  <div style="flex: 1; min-height: 0; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #d1fae5; color: #065f46; font-size: 13px; font-weight: 600"><i class="dot"></i>Live Poll · เปิดรับคำตอบ</span>
      <h1 style="font-size: 22px; line-height: 32px; font-weight: 700">ข้อใดมีค่าเท่ากับ 1024?</h1>
      <p style="font-size: 14px; line-height: 22px; color: #475569">เลือกได้หลายข้อ · เลือกแล้ว 2 ข้อ</p>
    </div>

    <div role="group" aria-label="ตัวเลือก" style="display: flex; flex-direction: column; gap: 10px">
      <button class="opt on" role="checkbox" aria-checked="true"><span class="key" style="border: 2px solid #4f46e5">A</span><code class="code"><span class="num">2</span> ** <span class="num">10</span></code><span class="box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span></button>
      <button class="opt on" role="checkbox" aria-checked="true" aria-label="B: 2 ยกกำลัง 10"><span class="key" style="border: 2px solid #0891b2">B</span><span class="m">2<sup style="font-size: 14px">10</sup></span><span class="box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span></button>
      <button class="opt" role="checkbox" aria-checked="false"><span class="key" style="border: 2px solid #d97706">C</span><code class="code"><span class="fn">Math</span>.<span class="fn">pow</span>(<span class="num">2</span>, <span class="num">9</span>)</code><span class="box"></span></button>
      <button class="opt" role="checkbox" aria-checked="false" aria-label="D: ผลรวมของ 2 ยกกำลัง k เมื่อ k เท่ากับ 0 ถึง 9"><span class="key" style="border: 2px solid #db2777">D</span><span class="m"><span class="lim"><small>9</small><span style="font-size: 26px">∑</span><small><i>k</i>=0</small></span> 2<sup style="font-size: 14px"><i>k</i></sup></span><span class="box"></span></button>
    </div>

    <button class="btn btn-p">ส่งคำตอบ (2 ข้อ)</button>
  </div>

  <nav class="tabs" aria-label="แท็บ">
    <button class="tab on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>กิจกรรม</button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>ถาม-ตอบ<span class="cnt">12</span></button>
  </nav>
</div>
</x-dc>

</body>
</html>
