<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>S13 Q&amp;A list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=STIX+Two+Text:ital,wght@0,400;1,400&amp;display=swap">
<style>
body{margin:0}
a.pl{text-decoration:none;cursor:pointer}
.ph{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#f8fafc;color:#0f172a;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:26px;position:relative;overflow:hidden}
.ph *{box-sizing:border-box}
.ph h1,.ph h2,.ph h3,.ph p{margin:0}
.hdr{display:flex;align-items:center;gap:4px;padding:8px 4px 8px 16px;border-bottom:1px solid #e2e8f0;min-height:64px;background:#ffffff}
.hdr-t{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr-t b{font-size:16px;line-height:24px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-t span{font-size:13px;line-height:20px;color:#475569;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#059669;flex:none;display:inline-block}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:#334155;padding:0;flex:none}
.tabs{display:flex;border-top:1px solid #e2e8f0;background:#ffffff;padding:0 8px 12px}
.tab{flex:1;height:60px;border:0;background:none;font:inherit;font-size:13px;line-height:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#475569;position:relative}
.tab.on{color:#b02f0b;font-weight:600}
.tab.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:#fa4616}
.seg{display:flex;padding:4px;border-radius:10px;background:#e2e8f0}
.seg button{flex:1;height:40px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:14px;font-weight:500;color:#334155}
.seg .on{background:#ffffff;color:#0f172a;font-weight:600;box-shadow:0 1px 2px 0 rgb(15 23 42 / .06),0 1px 3px 0 rgb(15 23 42 / .1)}
.q{display:flex;gap:12px;padding:14px 12px 14px 16px;border-radius:12px;background:#ffffff;border:1px solid #e2e8f0}
.q-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.q-t{font-size:16px;line-height:26px}
.q-m{display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:#475569;flex-wrap:wrap}
.up{width:52px;min-height:60px;flex:none;border-radius:10px;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:15px;font-weight:700;cursor:pointer}
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600}
.code{font-family:'IBM Plex Mono',monospace;font-size:14px;padding:1px 6px;border-radius:4px;background:#f1f5f9;border:1px solid #e2e8f0}
.m{font-family:'STIX Two Text',serif;font-size:18px}
.ask{position:absolute;left:16px;right:16px;bottom:84px;height:52px;border:0;border-radius:999px;background:#d63a0e;color:#ffffff;font:inherit;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 4px -2px rgb(15 23 42 / .1),0 4px 6px -1px rgb(15 23 42 / .1)}
</style>
</helmet>
<div class="ph">
  <div class="hdr">
    <div class="hdr-t"><b>INT365 Software Engineering</b><span><i class="dot"></i>เชื่อมต่อแล้ว · พลอย</span></div>
    <button class="ib" aria-label="เมนู"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></button>
  </div>

  <div style="flex: 1; min-height: 0; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div class="seg" role="tablist" aria-label="เรียงคำถาม">
      <button data-hot="" class="{{tabs.top.cls}}" role="tab" aria-selected="{{tabs.top.sel}}" onClick="{{tabs.top.pick}}">ยอดนิยม</button>
      <button data-hot="" class="{{tabs.new.cls}}" role="tab" aria-selected="{{tabs.new.sel}}" onClick="{{tabs.new.pick}}">ล่าสุด</button>
      <button data-hot="" class="{{tabs.mine.cls}}" role="tab" aria-selected="{{tabs.mine.sel}}" onClick="{{tabs.mine.pick}}">ของฉัน (1)</button>
    </div>

    <sc-for list="{{qs}}" as="q" hint-placeholder-count="4">
      <article class="q">
        <div class="q-b">
          <p class="q-t">{{q.lead}}<sc-if value="{{q.hasCode}}" hint-placeholder-val="{{ false }}"><code class="code">{{q.code}}</code></sc-if><sc-if value="{{q.hasMath}}" hint-placeholder-val="{{ false }}"><span class="m">2<sup style="font-size: 12px">10</sup></span></sc-if>{{q.tail}}</p>
          <div class="q-m">
            <span>{{q.author}}</span><span aria-hidden="true">·</span><span>{{q.time}}</span>
            <sc-if value="{{q.answered}}" hint-placeholder-val="{{ false }}"><span class="tag" style="background: #d1fae5; color: #065f46"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>ตอบแล้ว</span></sc-if>
            <sc-if value="{{q.mine}}" hint-placeholder-val="{{ false }}"><span class="tag" style="background: #ffe6da; color: #8c2810">คำถามของคุณ</span></sc-if>
          </div>
        </div>
        <button data-hot="" class="up" style="{{q.upStyle}}" aria-pressed="{{q.pressed}}" aria-label="{{q.upLabel}}" onClick="{{q.toggle}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
          {{q.votes}}
        </button>
      </article>
    </sc-for>
  </div>

  <a data-hot="" href="S14-Ask-anon.dc.html" class="ask pl"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>ถามคำถาม</a>

  <nav class="tabs" aria-label="แท็บ">
    <a data-hot="" href="S12-WordCloud-results.dc.html" class="tab pl"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>กิจกรรม</a>
    <button class="tab on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>ถาม-ตอบ</button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { voted: { q1: true }, tab: 'top' };
  }
  renderVals() {
    const base = [
      { id: 'q1', lead: 'ทำไม ', code: 'valueChanges', tail: ' ถึงยิงทุกครั้งที่พิมพ์ ต้องใช้ debounce ไหมครับ?', author: 'ไม่ระบุชื่อ', time: '3 นาที', min: 3, votes: 23, answered: false, mine: false, hasCode: true, hasMath: false },
      { id: 'q2', lead: 'ถ้า input มีได้ ', code: '', tail: ' แบบ ต้องเก็บกี่บิตครับ?', author: 'ต้นกล้า', time: '6 นาที', min: 6, votes: 14, answered: true, mine: false, hasCode: false, hasMath: true },
      { id: 'q3', lead: 'Template-driven กับ Reactive Forms ควรเลือกแบบไหนในโปรเจกต์กลุ่ม?', code: '', tail: '', author: 'ไม่ระบุชื่อ', time: '8 นาที', min: 8, votes: 9, answered: false, mine: false, hasCode: false, hasMath: false },
      { id: 'q4', lead: 'อาจารย์จะเปิดสไลด์ย้อนหลังให้ดาวน์โหลดไหมคะ?', code: '', tail: '', author: 'ไม่ระบุชื่อ', time: '1 นาที', min: 1, votes: 2, answered: false, mine: true, hasCode: false, hasMath: false }
    ];
    const voted = this.state.voted;
    const tab = this.state.tab;
    const shown = tab === 'mine' ? base.filter((q) => q.mine) : base.slice();
    const rank = (q) => q.votes + (voted[q.id] ? 1 : 0);
    if (tab === 'top') shown.sort((a, b) => rank(b) - rank(a));
    if (tab === 'new') shown.sort((a, b) => a.min - b.min);
    const mk = (key) => ({ cls: tab === key ? 'on' : '', sel: tab === key ? 'true' : 'false', pick: () => this.setState({ tab: key }) });
    const qs = shown.map((q) => {
      const on = !!voted[q.id];
      const votes = q.votes + (on ? 1 : 0);
      let upStyle = 'border: 1px solid #cbd5e1; background: #ffffff; color: #334155';
      if (on) upStyle = 'border: 2px solid #d63a0e; background: #fff4ee; color: #b02f0b';
      if (q.mine) upStyle = 'border: 1px dashed #cbd5e1; background: #f8fafc; color: #64748b; cursor: default';
      return Object.assign({}, q, {
        votes: votes,
        upStyle: upStyle,
        pressed: on ? 'true' : 'false',
        upLabel: q.mine ? 'โหวตคำถามตัวเองไม่ได้ ' + votes + ' โหวต' : 'โหวตขึ้น ' + votes + ' โหวต',
        toggle: () => {
          if (q.mine) return;
          const next = Object.assign({}, this.state.voted);
          next[q.id] = !next[q.id];
          this.setState({ voted: next });
        }
      });
    });
    return { qs, tabs: { top: mk('top'), new: mk('new'), mine: mk('mine') } };
  }
}
</script>
</body>
</html>
