<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>S07 Live Poll answer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a.pl{text-decoration:none;cursor:pointer}
.ph{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#ffffff;color:#0f172a;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:26px;position:relative;overflow:hidden}
.ph *{box-sizing:border-box}
.ph h1,.ph h2,.ph h3,.ph p{margin:0}
.hdr{display:flex;align-items:center;gap:4px;padding:8px 4px 8px 16px;border-bottom:1px solid #e2e8f0;min-height:64px;background:#ffffff}
.hdr-t{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr-t b{font-size:16px;line-height:24px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-t span{font-size:13px;line-height:20px;color:#475569;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#059669;flex:none;display:inline-block}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:#334155;padding:0;flex:none}
.btn{height:52px;border-radius:8px;border:0;font:inherit;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 20px;cursor:pointer}
.btn-p{background:#d63a0e;color:#ffffff}
.btn-off{background:#e2e8f0;color:#475569;cursor:default}
.tabs{display:flex;border-top:1px solid #e2e8f0;background:#ffffff;padding:0 8px 12px}
.tab{flex:1;height:60px;border:0;background:none;font:inherit;font-size:13px;line-height:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#475569;position:relative}
.tab.on{color:#b02f0b;font-weight:600}
.tab.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:#fa4616}
.cnt{min-width:20px;height:20px;border-radius:10px;background:#d63a0e;color:#ffffff;font-size:11px;line-height:20px;font-weight:600;padding:0 6px;position:absolute;top:6px;left:calc(50% + 8px)}
.react{position:absolute;right:16px;bottom:84px;height:48px;padding:0 18px 0 14px;border-radius:999px;border:0;background:#0f172a;color:#ffffff;font:inherit;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 2px 4px -2px rgb(15 23 42 / .1),0 4px 6px -1px rgb(15 23 42 / .1)}
.opt{width:100%;min-height:64px;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;font:inherit;font-size:17px;line-height:26px;color:#0f172a;text-align:left;cursor:pointer}
.key{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;background:#ffffff}
.radio{width:22px;height:22px;border-radius:50%;flex:none;margin-left:auto}
</style>
</helmet>
<div class="ph">
  <div class="hdr">
    <div class="hdr-t"><b>INT365 Software Engineering</b><span><i class="dot"></i>เชื่อมต่อแล้ว · พลอย</span></div>
    <button class="ib" aria-label="เมนู"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></button>
  </div>

  <div style="flex: 1; min-height: 0; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #d1fae5; color: #065f46; font-size: 13px; font-weight: 600"><i class="dot"></i>Live Poll · เปิดรับคำตอบ</span>
      <h1 style="font-size: 22px; line-height: 32px; font-weight: 700">ภาษาโปรแกรมไหนที่คุณใช้บ่อยที่สุด?</h1>
      <p style="font-size: 14px; line-height: 22px; color: #475569">เลือก 1 ข้อ · เปลี่ยนคำตอบได้จนกว่าจะปิดโหวต</p>
    </div>

    <div role="radiogroup" aria-label="ตัวเลือก" style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
        <button data-hot="" class="opt" role="radio" aria-checked="{{o.checked}}" style="{{o.cardStyle}}" onClick="{{o.pick}}">
          <span class="key" style="{{o.keyStyle}}">{{o.key}}</span>
          <span>{{o.label}}</span>
          <span class="radio" style="{{o.radioStyle}}"></span>
        </button>
      </sc-for>
    </div>

    <sc-if value="{{hasPick}}" hint-placeholder-val="{{ false }}">
      <a data-hot="" href="S08-Poll-sent.dc.html" class="btn btn-p pl">ส่งคำตอบ</a>
    </sc-if>
    <sc-if value="{{noPick}}" hint-placeholder-val="{{ true }}">
      <button class="btn btn-off" disabled>เลือกคำตอบก่อนส่ง</button>
    </sc-if>
  </div>

  <button class="react" aria-label="ส่งรีแอคชัน"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 14a4 4 0 0 0 7 0M9 9.5h.01M15 9.5h.01"></path></svg>+ React</button>

  <nav class="tabs" aria-label="แท็บ">
    <button class="tab on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>กิจกรรม</button>
    <a data-hot="" href="S13-QA-list.dc.html" class="tab pl"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>ถาม-ตอบ<span class="cnt">12</span></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null };
  }
  renderVals() {
    const base = [
      { key: 'A', label: 'Python', color: '#4f46e5' },
      { key: 'B', label: 'JavaScript', color: '#0891b2' },
      { key: 'C', label: 'Java', color: '#d97706' },
      { key: 'D', label: 'C++', color: '#db2777' }
    ];
    const picked = this.state.picked;
    const options = base.map((o) => {
      const on = o.key === picked;
      return {
        key: o.key,
        label: o.label,
        checked: on ? 'true' : 'false',
        cardStyle: on
          ? 'border: 2px solid #fa4616; background: #fff4ee; padding: 11px 15px'
          : 'border: 1px solid #cbd5e1; background: #ffffff',
        keyStyle: 'border: 2px solid ' + o.color + '; color: #0f172a',
        radioStyle: on
          ? 'border: 7px solid #d63a0e; background: #ffffff'
          : 'border: 2px solid #94a3b8; background: #ffffff',
        pick: () => this.setState({ picked: o.key })
      };
    });
    return { options, hasPick: !!picked, noPick: !picked };
  }
}
</script>
</body>
</html>
