<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>R2 Live Quiz editor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.app{min-height:900px;display:flex;flex-direction:column;background:#f8fafc;color:#0f172a;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;line-height:24px}
.app *{box-sizing:border-box}
.app h1,.app h2,.app h3,.app p{margin:0}
.btn{height:40px;border-radius:8px;border:0;font:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;white-space:nowrap}
.btn-p{background:#d63a0e;color:#ffffff}
.btn-s{background:#ffffff;color:#0f172a;border:1px solid #cbd5e1}
.btn-g{background:transparent;color:#334155}
.thumb{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:10px;border:0;background:transparent;font:inherit;text-align:left;width:100%}
.thumb b{width:20px;font-size:12px;line-height:18px;color:#475569;font-weight:600;text-align:right;flex:none}
.tb{flex:1;aspect-ratio:16/9;border-radius:6px;background:#ffffff;border:1px solid #e2e8f0;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:8px;font-size:10px;line-height:14px;color:#334155;overflow:hidden}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;line-height:20px;font-weight:600;color:#334155}
.inp{height:44px;border:1px solid #cbd5e1;border-radius:8px;padding:0 12px;font:inherit;font-size:15px;color:#0f172a;background:#ffffff;width:100%}
.optrow{display:flex;align-items:center;gap:8px}
.key{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:#ffffff;color:#0f172a}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #e2e8f0}
.sw{width:40px;height:24px;border-radius:999px;border:0;padding:2px;display:flex;flex:none}
.sw i{width:20px;height:20px;border-radius:50%;background:#ffffff}
.seg{display:flex;padding:4px;border-radius:10px;background:#e2e8f0}
.seg button{flex:1;height:36px;border:0;border-radius:8px;background:transparent;font:inherit;font-size:14px;font-weight:500;color:#334155}
.seg .on{background:#ffffff;color:#0f172a;font-weight:600;box-shadow:0 1px 3px 0 rgb(15 23 42 / .1)}
</style>
</helmet>
<div class="app">
  <header style="display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 10px 16px; background: #ffffff; border-bottom: 1px solid #e2e8f0">
    <span style="width: 32px; height: 32px; border-radius: 8px; background: #fa4616; flex: none"></span>
    <div style="display: flex; flex-direction: column; flex: 1 1 240px">
      <h1 style="font-size: 16px; line-height: 24px; font-weight: 600">INT365 · บทที่ 4 Reactive Forms</h1>
      <span style="font-size: 12px; line-height: 18px; color: #475569">บันทึกแล้ว · 21 สไลด์</span>
    </div>
    <button class="btn btn-s">ดูตัวอย่าง</button>
    <button class="btn btn-p">เริ่มเซสชัน</button>
  </header>

  <div style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch">
    <nav aria-label="สไลด์" style="flex: 0 0 200px; background: #ffffff; border-right: 1px solid #e2e8f0; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px">
      <button class="thumb"><b>6</b><span class="tb"><b>Live Poll</b></span></button>
      <button class="thumb" aria-current="true" style="background: #fff4ee; box-shadow: inset 0 0 0 2px #fa4616"><b style="color: #b02f0b">7</b><span class="tb"><b>Live Quiz</b><span style="color: #475569">20 วินาที · 1000 คะแนน</span></span></button>
      <button class="thumb"><b>8</b><span class="tb"><b>Word Cloud</b></span></button>
    </nav>

    <main style="flex: 999 1 520px; min-width: 0; padding: 24px; display: flex; justify-content: center">
      <div style="width: 100%; max-width: 820px; aspect-ratio: 16 / 9; align-self: flex-start; background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 36px 44px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; align-items: center; gap: 12px"><span style="font-size: 14px; font-weight: 600; color: #475569">Live Quiz · สไลด์ 7</span><span style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; background: #f1f5f9; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg>20 วิ</span></div>
        <h2 style="font-size: 30px; line-height: 42px; font-weight: 700">Observable คืออะไร?</h2>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 19px"><span class="key" style="border: 2px solid #4f46e5">A</span>ค่าคงที่</div>
          <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 19px"><span class="key" style="border: 2px solid #0891b2">B</span>Promise แบบเก่า</div>
          <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 10px; border: 2px solid #059669; background: #ecfdf5; font-size: 19px"><span class="key" style="border: 2px solid #d97706">C</span>สตรีมข้อมูลหลายค่า<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-left: auto"><path d="M5 12l5 5L20 7"></path></svg></div>
          <div style="display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 10px; border: 1px solid #e2e8f0; font-size: 19px"><span class="key" style="border: 2px solid #db2777">D</span>ฟังก์ชัน</div>
        </div>
      </div>
    </main>

    <aside aria-label="แก้ไขกิจกรรม" style="flex: 1 1 320px; max-width: 380px; background: #ffffff; border-left: 1px solid #e2e8f0; padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="font-size: 17px; line-height: 26px; font-weight: 600">แก้ไขกิจกรรม</h2>
        <span style="height: 24px; padding: 0 8px; border-radius: 999px; background: #fce7f3; color: #9d174d; font-size: 12px; line-height: 24px; font-weight: 600">Live Quiz</span>
      </div>
      <div class="field"><label for="qq">คำถาม</label><input id="qq" class="inp" value="Observable คืออะไร?"></div>
      <div class="field">
        <label>ตัวเลือก · แตะวงกลมเพื่อเลือกข้อที่ถูก</label>
        <div class="optrow"><span class="key" style="border: 2px solid #4f46e5">A</span><input class="inp" value="ค่าคงที่" aria-label="ตัวเลือก A"></div>
        <div class="optrow"><span class="key" style="border: 2px solid #0891b2">B</span><input class="inp" value="Promise แบบเก่า" aria-label="ตัวเลือก B"></div>
        <div class="optrow"><span class="key" style="border: 2px solid #d97706">C</span><input class="inp" value="สตรีมข้อมูลหลายค่า" aria-label="ตัวเลือก C" style="border: 2px solid #059669"></div>
        <div class="optrow"><span class="key" style="border: 2px solid #db2777">D</span><input class="inp" value="ฟังก์ชัน" aria-label="ตัวเลือก D"></div>
      </div>
      <div class="field">
        <label>เวลาตอบ</label>
        <div class="seg" role="radiogroup"><button role="radio" aria-checked="false">10 วิ</button><button class="on" role="radio" aria-checked="true">20 วิ</button><button role="radio" aria-checked="false">30 วิ</button><button role="radio" aria-checked="false">60 วิ</button></div>
      </div>
      <div class="field" style="height: 81px">
        <label>คะแนน</label>
        <div class="seg" role="radiogroup" style="width: 279px; height: 59px"><button role="radio" aria-checked="false" style="height: 51px">ปกติ 500</button><button class="on" role="radio" aria-checked="true" style="height: 50px">มาตรฐาน 1000</button><button role="radio" aria-checked="false" style="height: 53px">2 เท่า</button></div>
      </div>
      <div>
        <div class="tg"><span>ตอบเร็วได้คะแนนมากกว่า</span><button class="sw" role="switch" aria-checked="true" aria-label="ตอบเร็วได้คะแนนมากกว่า" style="background: #d63a0e; justify-content: flex-end"><i></i></button></div>
        <div class="tg"><span>เฉลยบนจอเมื่อหมดเวลา</span><button class="sw" role="switch" aria-checked="true" aria-label="เฉลยบนจอเมื่อหมดเวลา" style="background: #d63a0e; justify-content: flex-end"><i></i></button></div>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
