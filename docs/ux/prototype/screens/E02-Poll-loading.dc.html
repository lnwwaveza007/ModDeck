<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.ph{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#ffffff;color:#0f172a;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:26px;position:relative;overflow:hidden}
.ph *{box-sizing:border-box}
.ph h1,.ph h2,.ph h3,.ph p{margin:0}
.hdr{display:flex;align-items:center;gap:4px;padding:8px 4px 8px 16px;border-bottom:1px solid #e2e8f0;min-height:64px;background:#ffffff}
.hdr-t{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr-t b{font-size:16px;line-height:24px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-t span{font-size:13px;line-height:20px;color:#475569;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#059669;flex:none;display:inline-block}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:#334155;padding:0;flex:none}
.tabs{display:flex;border-top:1px solid #e2e8f0;background:#ffffff;padding:0 8px 12px}
.tab{flex:1;height:60px;border:0;background:none;font:inherit;font-size:13px;line-height:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#475569;position:relative}
.tab.on{color:#b02f0b;font-weight:600}
.tab.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:#fa4616}
.sk{border-radius:8px;background:linear-gradient(90deg,#f1f5f9 0%,#e2e8f0 50%,#f1f5f9 100%);background-size:200% 100%;animation:sh 1.4s ease-in-out infinite}
@keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion: reduce){.sk{animation:none}}
</style>
</helmet>
<div class="ph">
  <div class="hdr">
    <div class="hdr-t"><b>INT365 Software Engineering</b><span><i class="dot"></i>เชื่อมต่อแล้ว · พลอย</span></div>
    <button class="ib" aria-label="เมนู"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg></button>
  </div>

  <div role="status" aria-label="กำลังโหลดกิจกรรม" style="flex: 1; min-height: 0; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div class="sk" style="width: 150px; height: 26px; border-radius: 999px"></div>
      <div class="sk" style="width: 100%; height: 26px"></div>
      <div class="sk" style="width: 70%; height: 26px"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div class="sk" style="height: 64px; border-radius: 12px"></div>
      <div class="sk" style="height: 64px; border-radius: 12px"></div>
      <div class="sk" style="height: 64px; border-radius: 12px"></div>
      <div class="sk" style="height: 64px; border-radius: 12px"></div>
    </div>
    <p style="font-size: 14px; line-height: 22px; color: #475569; text-align: center">กำลังโหลดกิจกรรม…</p>
  </div>

  <nav class="tabs" aria-label="แท็บ">
    <button class="tab on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>กิจกรรม</button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>ถาม-ตอบ</button>
  </nav>
</div>
</x-dc>
