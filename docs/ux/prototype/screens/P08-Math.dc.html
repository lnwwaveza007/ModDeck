<style>

<div class="scr">
  <div style="position: absolute; inset: 0; padding: 80px 96px 56px; display: flex; flex-direction: column; gap: 36px">
    <h1 style="font-size: 52px; line-height: 68px; font-weight: 700">ผลรวมอนุกรมเรขาคณิต</h1>

    <div role="math" aria-label="ผลรวมของ r ยกกำลัง k เมื่อ k เท่ากับ 0 ถึง n ลบ 1 เท่ากับ 1 ลบ r ยกกำลัง n ส่วน 1 ลบ r" style="align-self: center; padding: 36px 56px; border-radius: 20px; background: #f8fafc; border: 1px solid #e2e8f0">

        <span class="lim"><small><i>n</i> − 1</small><span style="font-size: 1.4em">∑</span><small><i>k</i> = 0</small></span>
        <span><i>r</i><sup><i>k</i></sup></span>
        <span>=</span>
        <span class="frac"><span>1 − <i>r</i><sup><i>n</i></sup></span><span>1 − <i>r</i></span></span>

      </span>

        <span class="lim"><small>9</small><span style="font-size: 1.3em">∑</span><small><i>k</i>=0</small></span>
        <span>2<sup><i>k</i></sup> = 2<sup>10</sup> − 1 = 1023</span>
      </span>
    </div>
    <span style="margin-top: auto; font-size: 18px; color: #475569">5 / 20</span>
  </div>
  <div class="join"><span>moddeck.kmutt.ac.th</span><b>482 914</b></div>
