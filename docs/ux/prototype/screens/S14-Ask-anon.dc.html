<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>S14 Ask question</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a.pl{text-decoration:none;cursor:pointer}
.ph{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#ffffff;color:#0f172a;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:26px;position:relative;overflow:hidden}
.ph *{box-sizing:border-box}
.ph h1,.ph h2,.ph h3,.ph p{margin:0}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:#334155;padding:0;flex:none}
.sw{width:52px;height:32px;border-radius:999px;border:0;padding:3px;display:flex;flex:none;cursor:pointer}
.sw i{width:26px;height:26px;border-radius:50%;background:#ffffff;box-shadow:0 1px 2px rgb(15 23 42 / .2)}
.code{font-family:'IBM Plex Mono',monospace;font-size:13px;padding:0 4px;border-radius:4px;background:#f1f5f9}
</style>
</helmet>
<div class="ph">
  <div style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 4px; border-bottom: 1px solid #e2e8f0; min-height: 64px">
    <a data-hot="" href="S13-QA-list.dc.html" class="ib pl" aria-label="ปิด"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <h1 style="flex: 1; font-size: 18px; line-height: 28px; font-weight: 600">ถามคำถาม</h1>
    
  </div>

  <div style="flex: 1; min-height: 0; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0">
      <div style="flex: 1; display: flex; flex-direction: column">
        <label for="anon" style="font-size: 16px; line-height: 24px; font-weight: 600">ถามแบบไม่ระบุชื่อ</label>
        <span style="font-size: 13px; line-height: 20px; color: #475569">อาจารย์และเพื่อนไม่เห็นชื่อคุณ</span>
      </div>
      <button data-hot="" id="anon" class="sw" role="switch" aria-checked="{{anonAria}}" style="{{swStyle}}" onClick="{{toggle}}"><i></i></button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="qtext" style="font-size: 14px; line-height: 22px; font-weight: 600">คำถาม</label>
      <textarea id="qtext" rows="4" maxlength="280" aria-describedby="qhelp" style="border: 2px solid #fa4616; outline: 4px solid #ffe6da; border-radius: 8px; padding: 12px 14px; font: inherit; font-size: 16px; line-height: 26px; color: #0f172a; resize: none; width: 100%">อาจารย์จะเปิดสไลด์ย้อนหลังให้ดาวน์โหลดไหมคะ?</textarea>
      <div id="qhelp" style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; line-height: 20px; color: #475569">
        <span>ใช้ <span class="code">`code`</span> และ <span class="code">$math$</span> ได้</span>
        <span>44/280</span>
      </div>
    </div>

    <sc-if value="{{anon}}" hint-placeholder-val="{{ true }}">
      <p role="status" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #f1f5f9; font-size: 15px; line-height: 24px; color: #0f172a">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a17 17 0 0 1-3 3.5M6.6 6.6A17 17 0 0 0 3 12s4 6 9 6a9.4 9.4 0 0 0 4.4-1.1"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg>
        <span>คุณจะแสดงเป็น: <b>ไม่ระบุชื่อ</b></span>
      </p>
    </sc-if>
    <sc-if value="{{named}}" hint-placeholder-val="{{ false }}">
      <p role="status" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #fffbeb; border: 1px solid #f59e0b; font-size: 15px; line-height: 24px; color: #92400e">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        <span>คุณจะแสดงเป็น: <b>พลอย</b> · ทุกคนเห็นชื่อนี้ รวมถึงจอหน้าห้อง</span>
      </p>
    </sc-if>

    <p style="font-size: 13px; line-height: 20px; color: #475569">ส่งได้ 1 คำถามทุก 20 วินาที</p><div data-dc-group="" style="box-sizing: border-box; display: block; flex-direction: column; gap: 14px; justify-content: normal; align-items: normal; position: relative; width: 374px"><a data-hot="" href="S15-Ask-named.dc.html" class="pl" style="height: 40px; padding: 0 16px; border: 0; border-radius: 8px; color: #ffffff; font: inherit; font-size: 15px; font-weight: 600; font-family: &quot;IBM Plex Sans Thai&quot;, system-ui, sans-serif; line-height: 1.733; width: 175px; margin-top: 3px; margin-right: 3px; margin-bottom: 3px; margin-left: 3px; background-color: #6A7077; display: inline-flex; align-items: center; justify-content: center; vertical-align: top" data-om-label="Preview">Preview</a><a data-hot="" href="S13-QA-list.dc.html" class="pl" style="height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: #d63a0e; color: #ffffff; font: inherit; font-size: 15px; font-weight: 600; font-family: &quot;IBM Plex Sans Thai&quot;, system-ui, sans-serif; line-height: 1.733; width: 175px; margin: 3px; display: inline-flex; align-items: center; justify-content: center; vertical-align: top">Send</a></div>
  </div>

  <div style="height: 300px; background: #f1f5f9; border-top: 1px solid #e2e8f0; display: grid; place-items: center">
    <span style="padding: 6px 12px; border: 1px dashed #94a3b8; border-radius: 8px; font-size: 13px; color: #475569">แป้นพิมพ์ของระบบ</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { anon: true };
  }
  renderVals() {
    const anon = this.state.anon;
    return {
      anon: anon,
      named: !anon,
      anonAria: anon ? 'true' : 'false',
      swStyle: anon
        ? 'background: #d63a0e; justify-content: flex-end'
        : 'background: #94a3b8; justify-content: flex-start',
      toggle: () => this.setState({ anon: !this.state.anon })
    };
  }
}
</script>
</body>
</html>
