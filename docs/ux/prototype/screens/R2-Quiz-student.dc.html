<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>R2 Quiz student answering</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.ph{width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#ffffff;color:#0f172a;font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:26px;position:relative;overflow:hidden}
.ph *{box-sizing:border-box}
.ph h1,.ph h2,.ph p{margin:0}
.opt{width:100%;min-height:72px;display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;font:inherit;font-size:18px;line-height:26px;color:#0f172a;text-align:left;border:2px solid #cbd5e1;background:#ffffff}
.key{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none;background:#ffffff}
</style>
</helmet>
<div class="ph">
  <div style="padding: 14px 16px 10px; border-bottom: 1px solid #e2e8f0">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px">
      <span style="font-size: 14px; font-weight: 600; color: #475569">Live Quiz · ข้อ 3</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: #fffbeb; border: 1px solid #f59e0b; color: #92400e; font-weight: 700; font-variant-numeric: tabular-nums"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg>0:12</span>
    </div>
    <div role="progressbar" aria-valuenow="12" aria-valuemin="0" aria-valuemax="20" aria-label="เวลาที่เหลือ 12 วินาที" style="height: 8px; border-radius: 4px; background: #f1f5f9; overflow: hidden"><div style="width: 60%; height: 100%; background: #d97706"></div></div>
  </div>

  <div style="flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 18px">
    <h1 style="font-size: 22px; line-height: 32px; font-weight: 700">Observable คืออะไร?</h1>
    <div role="radiogroup" aria-label="ตัวเลือก" style="display: flex; flex-direction: column; gap: 12px">
      <button class="opt" role="radio" aria-checked="false"><span class="key" style="border: 2px solid #4f46e5">A</span>ค่าคงที่</button>
      <button class="opt" role="radio" aria-checked="false"><span class="key" style="border: 2px solid #0891b2">B</span>Promise แบบเก่า</button>
      <button class="opt" role="radio" aria-checked="true" style="border-color: #fa4616; background: #fff4ee"><span class="key" style="border: 2px solid #d97706">C</span>สตรีมข้อมูลหลายค่า</button>
      <button class="opt" role="radio" aria-checked="false"><span class="key" style="border: 2px solid #db2777">D</span>ฟังก์ชัน</button>
    </div>
    <p role="status" style="text-align: center; font-size: 14px; line-height: 22px; color: #475569">ส่งคำตอบแล้ว ·&nbsp; ไม่สามารถเปลี่ยนคำตอบได้</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
