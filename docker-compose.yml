services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moddeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moddeck}
      POSTGRES_DB: ${POSTGRES_DB:-moddeck}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      args:
        APP: api
    environment:
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-moddeck}:${POSTGRES_PASSWORD:-moddeck}@postgres:5432/${POSTGRES_DB:-moddeck}
      REDIS_URL: redis://redis:6379
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      # Comma-separated emails that may impersonate another user. Empty: nobody.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      APP_BASE_URL: http://localhost:${WEB_PORT:-3000}
      SLIDES_DIR: /data/slides
      IMPORTS_DIR: /data/imports
    # Apply pending migrations and the demo seed (idempotent) before the dev server.
    command: ["sh", "-c", "pnpm db:generate && pnpm db:deploy && pnpm db:seed && pnpm dev"]
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/api/prisma:/repo/apps/api/prisma
      - slides:/data/slides
      - imports:/data/imports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/staging/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/staging/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/md8.json
    ports:
      - "3001:3000"
    volumes:
      - ./deploy/staging/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/staging/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  web:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      args:
        APP: web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
      API_INTERNAL_URL: http://api:4000 # dev rewrite of /api/* (next.config.ts)
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/public:/repo/apps/web/public
    depends_on:
      - api

volumes:
  pgdata:
  slides:
  imports:
  prometheusdata:
  grafanadata:
