ont-size="12">Baseline</text><path class="l1" d="M78.5,292.0L124.5,292.0L170.7,292.0L216.2,292.0L262.3,288.0L308.5,284.0L354.2,292.0L400.2,292.0L446.0,292.0L492.2,292.0L538.2,292.0L583.8,292.0" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle class="s1" cx="622" cy="306" r="4"/><text class="t1" x="630" y="310" font-size="12">Fixed</text></svg>
