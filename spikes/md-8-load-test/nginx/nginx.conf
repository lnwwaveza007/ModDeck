# Stretch goal: 2 api instances behind Nginx (SERVER machine).
# The api instances run on the host on :4000 and :4001; clients connect to :8080.
worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 16384;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  upstream moddeck_api {
    # The load test forces transports: ["websocket"], so no stickiness is needed.
    # Browsers that start with HTTP long-polling DO need it: use
    # `hash $remote_addr consistent;` (or a cookie) instead of least_conn.
    # Do not use ip_hash for the load test: every simulated client comes from
    # the same load-generator IP and would land on one instance.
    least_conn;
    server host.docker.internal:4000;
    server host.docker.internal:4001;
  }

  server {
    listen 8080;

    location /socket.io/ {
      proxy_pass http://moddeck_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location / {
      proxy_pass http://moddeck_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
