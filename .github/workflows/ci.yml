name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: moddeck
          POSTGRES_PASSWORD: moddeck
          POSTGRES_DB: moddeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moddeck -d moddeck"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://moddeck:moddeck@localhost:5432/moddeck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api db:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test (Jest)
        run: pnpm test

      - name: Migrate and seed database
        run: |
          pnpm --filter api db:migrate
          pnpm --filter api db:seed

      - name: Test API e2e
        run: pnpm --filter api test:e2e
