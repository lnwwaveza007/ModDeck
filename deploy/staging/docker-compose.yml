# Staging stack. The deploy job copies this folder to /opt/moddeck on the VM
# and writes .env there from GitHub Actions secrets (see README.md).
name: moddeck-staging

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moddeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-moddeck}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: "${API_IMAGE:?set API_IMAGE in .env}"
    restart: unless-stopped
    environment:
      API_PORT: 4000
      # Origin only (CORS). The URL prefix goes in APP_BASE_URL.
      WEB_ORIGIN: ${PUBLIC_ORIGIN:-https://${STAGING_HOST:?set STAGING_HOST in .env}}
      DATABASE_URL: postgresql://${POSTGRES_USER:-moddeck}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-moddeck}
      REDIS_URL: redis://redis:6379
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      # Comma-separated emails that may impersonate another user. Empty: nobody.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Public URL incl. prefix. The Entra redirect URI is this + /api/auth/callback.
      APP_BASE_URL: ${PUBLIC_ORIGIN:-https://${STAGING_HOST}}${BASE_PATH:-}
      SLIDES_DIR: /data/slides
      IMPORTS_DIR: /data/imports
    volumes:
      - slides:/data/slides
      - imports:/data/imports
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    depends_on:
      api:
        condition: service_started

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/md8.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

  web:
    image: "${WEB_IMAGE:?set WEB_IMAGE in .env}"
    restart: unless-stopped
    healthcheck:
      # Under a basePath "/" is a 404, so probe a real page below the prefix.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000${BASE_PATH:-}/login"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    depends_on:
      - api

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  slides:
  imports:
  prometheusdata:
  grafanadata:
