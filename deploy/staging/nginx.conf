# Staging reverse proxy. Based on spikes/md-8-load-test/nginx/nginx.conf.
#   /            -> web (Next.js)
#   /api/...     -> api, with the /api prefix removed (/api/health -> /health)
#   /socket.io/  -> api, WebSocket upgrade (wss://)
worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 16384;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 50m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # Docker DNS. Re-resolve so a recreated container's new IP is picked up
  # without restarting Nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    # Phones download the staging CA from here once, before HTTPS works.
    location = /ca.crt {
      root /etc/nginx/certs;
      default_type application/x-x509-ca-cert;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    set $web http://web:3000;
    set $api http://api:4000;

    location /socket.io/ {
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }

    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location / {
      proxy_pass $web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
